<!--
  StreamSaver transport page, kept on the application's own origin so browser
  previews that block third-party frames can still create streamed downloads.
-->
<script>
let keepAlive = () => {
  keepAlive = () => {}
  const ping = location.href.slice(0, location.href.lastIndexOf('/')) + '/ping'
  const interval = setInterval(() => {
    if (sw) {
      sw.postMessage('ping')
    } else {
      fetch(ping).then(response => response.text(!response.ok && clearInterval(interval)))
    }
  }, 10000)
}

const messages = []
window.onmessage = event => messages.push(event)

let sw = null
let scope = ''

async function registerWorker() {
  const expectedScope = new URL('./', location.href).href
  let registration = await navigator.serviceWorker.getRegistration('./')
  if (registration && registration.scope === expectedScope) {
    // Existing browser profiles must activate the current transport before export.
    await registration.update()
  } else {
    registration = await navigator.serviceWorker.register('sw.js', { scope: './' })
  }
  scope = registration.scope
  const pendingWorker = registration.installing || registration.waiting
  if (pendingWorker && pendingWorker.state !== 'activated') {
    await new Promise((resolve, reject) => {
      function onStateChange() {
        if (pendingWorker.state === 'activated' || pendingWorker.state === 'redundant') {
          pendingWorker.removeEventListener('statechange', onStateChange)
          if (pendingWorker.state === 'redundant') reject(new Error('[StreamSaver] Worker activation failed'))
          else resolve()
        }
      }
      pendingWorker.addEventListener('statechange', onStateChange)
      onStateChange()
    })
  }
  sw = registration.active
  if (!sw) throw new Error('[StreamSaver] No active download worker')
}

function onMessage(event) {
  const { data, ports, origin } = event
  if (!ports || !ports.length) {
    throw new TypeError('[StreamSaver] A message channel is required')
  }
  if (typeof data !== 'object') {
    throw new TypeError('[StreamSaver] Download metadata is required')
  }

  data.origin = origin
  data.referrer = data.referrer || document.referrer || origin
  data.streamSaverVersion = new URLSearchParams(location.search).get('version')
  data.pathname = (data.pathname || Math.random().toString().slice(-6) + '/' + data.filename).replace(/^\/+/, '')

  const host = origin.replace(/(^\w+:|^)\/\//, '')
  data.url = new URL(`${scope + host}/${data.pathname}`).toString()
  if (!data.url.startsWith(`${scope + host}/`)) {
    throw new TypeError('[StreamSaver] Invalid download path')
  }

  const transferable = data.readableStream ? [ports[0], data.readableStream] : [ports[0]]
  if (!(data.readableStream || data.transferringReadable)) {
    keepAlive()
  }
  sw.postMessage(data, transferable)
}

if (window.opener) {
  window.opener.postMessage('StreamSaver::loadedPopup', '*')
}

if (navigator.serviceWorker) {
  registerWorker().then(() => {
    window.onmessage = onMessage
    messages.forEach(window.onmessage)
  })
} else {
  keepAlive()
}
</script>
